# =============================================================================
# RegIntel — local run of both containers
#   docker compose up --build
#   API: http://localhost:8000/docs     UI: http://localhost:8501
#
# The API authenticates to Azure with DefaultAzureCredential. Inside a container there is no
# `az login`, so put a service principal in .env (AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_CLIENT_SECRET) with the same roles your user has; in Azure the managed identity is used.
# Without credentials the API still starts: /healthz is up and /readyz says why it is not ready.
# =============================================================================
services:
  api:
    build: { context: ., dockerfile: Dockerfile }
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      DATA_DIR: /app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/healthz').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  ui:
    build: { context: ., dockerfile: Dockerfile.frontend }
    ports: ["8501:8501"]
    environment:
      REGINTEL_API_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
